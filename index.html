<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atelier artistique</title>
    <style>
        body {
            margin: 0;
            font-family: Georgia, serif;
            background: #faf7f2;
            color: #333;
            text-align: center;
        }

        header {
            padding: 60px 20px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.2rem;
        }

        .gallery {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 40px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            width: 250px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }
    </style>
</head>

<body>

<header>
    <h1>Bienvenue dans notre atelier</h1>
    <p>Aquarelles, illustrations et créations numériques</p>
</header>

<section class="gallery">

    <div class="card">
        <h2>Aquarelles</h2>
        <p>Découvrez nos créations originales.</p>
    </div>

    <div class="card">
        <h2>Créations digitales</h2>
        <p>Illustrations et œuvres numériques.</p>
    </div>

</section>

</body>
</html>
